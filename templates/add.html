{% extends 'base.html' %}
{% block title %}Add expense - FloFinance{% endblock %}

{% block content %}
<div style="max-width:460px;">
  <h2 style="margin-bottom:4px;">Add expense</h2>
  <p style="color:#666; margin-bottom:16px; font-size:13px;">Log a new expense to your account</p>
  <div class="card">
    <form method="POST">
      <label>Amount (€)</label>
      <input type="number" name="amount" placeholder="0.00" step="0.01" min="0.01" required>
      <label>Category</label>
      <select name="category" required>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>
      <label>Description (optional)</label>
      <input type="text" name="description" placeholder="e.g. Coffee, rent, groceries">
      <label>Date</label>
      <input type="date" name="date" required>
      <br><br>
      <button type="submit" class="btn btn-primary">Save expense</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-ghost" style="margin-left:8px;">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
