{% extends 'base.html' %}
{% block title %}Sign in - FloFinance{% endblock %}

{% block content %}
<div style="max-width:380px; margin: 40px auto;">
  <h2 style="margin-bottom:4px;">Sign in</h2>
  <p style="color:#666; margin-bottom:20px; font-size:13px;">No account? <a href="{{ url_for('register') }}" style="color:#2563eb;">Register here</a></p>
  <div class="card">
    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@email.com" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <br><br>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
